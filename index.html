<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculadora IMC</title>
</head>
<body>
    <main class="container">
        <article class="calculadora-imc">
            <header>
                <h1>Calcule seu IMC!!</h1>
                <p>Abaixo preencha o formulário com seu peso e altura.</p>
            </header> 

            <form id="formulario-imc">
                <fieldset>
                    <legend>Peso e altura</legend>
                    <div class="campo-formulario">

                        <label for="peso">Peso (kg)</label>

                        <input type="number" id="peso" placeholder="Ex: 60" required>
                    </div>


                    <div class="campo-formulario">
                        <label for="altura">Altura (m)</label>

                        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.70" required>
                    </div>
                </fieldset>
                <button type="button" onclick="calcularIMC()">
                    Clique para calcular o IMC
                </button>
            </form>
            <section class="resultado" aria-live="polite">
                <p id="valor-imc"></p>
                <p id="situacao"></p>
            </section>
        </article>
    </main>
    <script src="./script.js"></script>
</body>
</html>
